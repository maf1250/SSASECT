<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بناء الجدول التدريبي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-2: #159e9c;
      --primary-3: #dff6f3;
      --accent: #0b5f59;
      --text: #153133;
      --muted: #5f6f72;
      --border: #d7e7e7;
      --white: #ffffff;
      --shadow: 0 20px 60px rgba(10, 55, 59, 0.12);
      --radius-xl: 28px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top right, rgba(21, 158, 156, 0.15), transparent 25%),
                  linear-gradient(180deg, #f5fbfb 0%, #eef7f6 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 20px;
      flex-grow: 1;
    }
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: var(--shadow);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 22px;
    }
    .section-head h2 { margin: 0 0 8px; font-size: 24px; }
    .section-head p { margin: 0; color: var(--muted); }
    
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 18px;
      align-items: end;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 700; font-size: 15px; }
    select, input {
      width: 100%; border: 1px solid var(--border); background: #fff;
      min-height: 52px; border-radius: 16px; padding: 12px 16px;
      font-family: inherit; font-size: 15px; color: var(--text); outline: none; transition: 0.2s ease;
    }
    select:focus, input:focus { border-color: var(--primary-2); box-shadow: 0 0 0 4px rgba(21, 158, 156, 0.12); }
    select:disabled { background: #f0f4f4; cursor: not-allowed; color: var(--muted); }
    
    .btn-add {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white; border: none; min-height: 52px; border-radius: 16px;
      font-weight: 700; font-size: 16px; font-family: inherit; cursor: pointer; transition: 0.2s ease;
    }
    .btn-add:hover { opacity: 0.9; transform: translateY(-2px); }

    table {
      width: 100%; border-collapse: collapse; margin-top: 20px;
      background: #fff; border-radius: 16px; overflow: hidden;
    }
    th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--border); }
    th { background: var(--primary-3); color: var(--accent); font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    
    .btn-delete {
      background: #ffe3e3; color: #d62828; border: none; padding: 6px 12px;
      border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600;
    }
    
    .result-box {
      margin-top: 24px; padding: 20px;
      background: linear-gradient(180deg, #f4fbfa 0%, #ecf8f6 100%);
      border: 1px solid var(--primary-2); border-radius: 16px;
    }
    .result-box h3 { margin: 0 0 10px 0; color: var(--accent); }
    .result-box ul { margin: 0; padding-right: 20px; line-height: 1.8; }

    .hidden { display: none !important; }
    
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 20px;
      padding-bottom: 40px;
    }
    .visitor-text {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="section-head">
        <h2>بناء الجدول التدريبي للمدرب</h2>
        <p>قم بتصفية المقررات ثم اختر نمط التنفيذ للإضافة إلى الجدول.</p>
      </div>

      <!-- القسم العلوي: تصفيات الأقسام والمراحل -->
      <div class="form-grid">
        <div class="field">
          <label for="unitSelect">الوحدة التدريبية</label>
          <select id="unitSelect">
            <option value="">جاري التحميل...</option>
          </select>
        </div>

        <div class="field">
          <label for="stageSelect">المرحلة التدريبية</label>
          <select id="stageSelect" disabled>
            <option value="">اختر الوحدة أولاً</option>
          </select>
        </div>

        <div class="field">
          <label for="majorSelect">التخصص</label>
          <select id="majorSelect" disabled>
            <option value="">اختر المرحلة أولاً</option>
          </select>
        </div>
      </div>

      <!-- القسم السفلي: إعدادات المقرر وإضافته -->
      <div class="form-grid" style="border-top: 1px solid var(--border); padding-top: 18px; margin-top: 18px;">
        <div class="field">
          <label for="courseSelect">المقرر التدريبي</label>
          <select id="courseSelect" disabled>
            <option value="">اختر التخصص أولاً</option>
          </select>
        </div>

        <div class="field">
          <label for="scheduleType">نوع الجدولة للمدرب</label>
          <select id="scheduleType" disabled>
            <option value="">اختر المقرر أولاً</option>
          </select>
        </div>
        
        <div class="field">
          <label for="modeSelect">نمط التنفيذ</label>
          <select id="modeSelect" disabled>
            <option value="traditional">تقليدي (حضوري بالكامل)</option>
            <option value="distance">مدمج - عن بعد</option>
            <option value="self">مدمج - ذاتي</option>
          </select>
        </div>

        <!-- يظهر هذا الحقل فقط إذا اختار المقرر كاملاً وكان النمط مدمجاً والمقرر له شقين -->
        <div class="field hidden" id="ePartField">
          <label for="ePartSelect">الشق المحوّل لإلكتروني</label>
          <select id="ePartSelect">
            <option value="theory">الشق النظري</option>
            <option value="practical">الشق العملي</option>
          </select>
        </div>

        <!-- يظهر هذا الحقل عند اختيار مدمج لاختيار عدد الساعات -->
        <div class="field hidden" id="eHoursField">
          <label for="eHoursSelect">ساعات النمط الإلكتروني</label>
          <select id="eHoursSelect">
          </select>
        </div>

        <div class="field">
          <button class="btn-add" id="addBtn">إضافة للجدول +</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-head">
        <h2>الجدول التدريبي الحالي</h2>
      </div>
      
      <div style="overflow-x: auto;">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>المقرر</th>
              <th>النمط</th>
              <th>حضور (نظري)</th>
              <th>حضور (عملي)</th>
              <th>إلكتروني (مدمج)</th>
              <th>الاحتساب (الساعات)</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--muted);">لم يتم إضافة مقررات بعد</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="result-box" id="resultBox" style="display: none;">
        <h3>إجمالي النصاب التدريبي: <span id="totalHours" style="font-weight:900;">0</span> ساعة</h3>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
        <strong>شرح تفصيلي لآلية الحساب:</strong>
        <ul id="explanationList"></ul>
      </div>
    </div>
  </main>

  <footer>
    <span class="visitor-text">إجمالي عدد الزيارات</span>
    <img src="https://visitor-badge.laobi.icu/badge?page_id=https%3A%2F%2Fmaf1250.github.io%2FSSASECT%2Fschedule" alt="visitor badge"/>
  </footer>

  <script>
    const PRACTICAL_FACTOR = 0.66667;
    let allCourses = []; 
    let schedule = []; 
    let currentCourseData = null;

    const unitSelect = document.getElementById('unitSelect');
    const stageSelect = document.getElementById('stageSelect');
    const majorSelect = document.getElementById('majorSelect');
    const courseSelect = document.getElementById('courseSelect');
    
    const scheduleType = document.getElementById('scheduleType');
    const modeSelect = document.getElementById('modeSelect');
    const ePartField = document.getElementById('ePartField');
    const ePartSelect = document.getElementById('ePartSelect');
    const eHoursField = document.getElementById('eHoursField');
    const eHoursSelect = document.getElementById('eHoursSelect');
    const addBtn = document.getElementById('addBtn');
    
    const scheduleBody = document.getElementById('scheduleBody');
    const resultBox = document.getElementById('resultBox');
    const totalHoursEl = document.getElementById('totalHours');
    const explanationList = document.getElementById('explanationList');

    Papa.parse("courses.csv", {
      download: true,
      header: true,
      complete: function(results) {
        allCourses = results.data.filter(row => row['المقرر']); 
        populateUnits(); 
      },
      error: function() {
        unitSelect.innerHTML = '<option value="">حدث خطأ في تحميل ملف الخطط</option>';
      }
    });

    function populateUnits() {
      const units = [...new Set(allCourses.map(course => course['الوحدة التدريبية']))].filter(Boolean);
      unitSelect.innerHTML = '<option value="">-- اختر الوحدة التدريبية --</option>';
      units.forEach(unit => unitSelect.innerHTML += `<option value="${unit}">${unit}</option>`);
    }

    unitSelect.addEventListener('change', function() {
      stageSelect.innerHTML = '<option value="">اختر الوحدة أولاً</option>'; stageSelect.disabled = true;
      majorSelect.innerHTML = '<option value="">اختر المرحلة أولاً</option>'; majorSelect.disabled = true;
      courseSelect.innerHTML = '<option value="">اختر التخصص أولاً</option>'; courseSelect.disabled = true;
      resetCourseConfig();

      if (!this.value) return;
      const filteredByUnit = allCourses.filter(c => c['الوحدة التدريبية'] === this.value);
      const stages = [...new Set(filteredByUnit.map(c => c['المرحلة التدريبية']))].filter(Boolean);
      stageSelect.innerHTML = '<option value="">-- اختر المرحلة التدريبية --</option>';
      stages.forEach(stage => stageSelect.innerHTML += `<option value="${stage}">${stage}</option>`);
      stageSelect.disabled = false;
    });

    stageSelect.addEventListener('change', function() {
      majorSelect.innerHTML = '<option value="">اختر المرحلة أولاً</option>'; majorSelect.disabled = true;
      courseSelect.innerHTML = '<option value="">اختر التخصص أولاً</option>'; courseSelect.disabled = true;
      resetCourseConfig();

      if (!this.value) return;
      const filtered = allCourses.filter(c => c['الوحدة التدريبية'] === unitSelect.value && c['المرحلة التدريبية'] === this.value);
      const majors = [...new Set(filtered.map(c => c['التخصص']))].filter(Boolean);
      majorSelect.innerHTML = '<option value="">-- اختر التخصص --</option>';
      majors.forEach(major => majorSelect.innerHTML += `<option value="${major}">${major}</option>`);
      majorSelect.disabled = false;
    });

    majorSelect.addEventListener('change', function() {
      courseSelect.innerHTML = '<option value="">اختر التخصص أولاً</option>'; courseSelect.disabled = true;
      resetCourseConfig();

      if (!this.value) return;
      const filtered = allCourses.filter(c => c['الوحدة التدريبية'] === unitSelect.value && c['المرحلة التدريبية'] === stageSelect.value && c['التخصص'] === this.value);
      courseSelect.innerHTML = '<option value="">-- اختر المقرر --</option>';
      filtered.forEach(course => courseSelect.innerHTML += `<option value="${course['المقرر']}">${course['المقرر']}</option>`);
      courseSelect.disabled = false;
    });

    function resetCourseConfig() {
      currentCourseData = null;
      scheduleType.innerHTML = '<option value="">اختر المقرر أولاً</option>';
      scheduleType.disabled = true;
      modeSelect.disabled = true;
      modeSelect.value = 'traditional';
      ePartField.classList.add('hidden');
      eHoursField.classList.add('hidden');
    }

    courseSelect.addEventListener('change', function() {
      if(!this.value) {
        resetCourseConfig();
        return;
      }
      
      currentCourseData = allCourses.find(c => 
        c['الوحدة التدريبية'] === unitSelect.value &&
        c['المرحلة التدريبية'] === stageSelect.value &&
        c['التخصص'] === majorSelect.value &&
        c['المقرر'] === this.value
      );

      const tHours = parseFloat(currentCourseData['محاضرة']) || 0;
      const pHours = parseFloat(currentCourseData['عملي']) || 0;

      scheduleType.innerHTML = '';
      
      if (tHours > 0 && pHours > 0) {
        scheduleType.innerHTML += `<option value="both">نظري وعملي (كامل المقرر)</option>`;
        scheduleType.innerHTML += `<option value="theory">الشق النظري فقط</option>`;
        scheduleType.innerHTML += `<option value="practical">الشق العملي فقط</option>`;
      } else if (tHours > 0 && pHours === 0) {
        scheduleType.innerHTML += `<option value="theory">نظري فقط</option>`;
      } else if (tHours === 0 && pHours > 0) {
        scheduleType.innerHTML += `<option value="practical">عملي فقط</option>`;
      }

      scheduleType.disabled = false;
      modeSelect.disabled = false;
      modeSelect.value = 'traditional';
      updateDynamicFields();
    });

    scheduleType.addEventListener('change', updateDynamicFields);
    modeSelect.addEventListener('change', updateDynamicFields);
    ePartSelect.addEventListener('change', updateDynamicFields);

    function updateDynamicFields() {
      if(!currentCourseData) return;

      const tHours = parseFloat(currentCourseData['محاضرة']) || 0;
      const pHours = parseFloat(currentCourseData['عملي']) || 0;
      const sType = scheduleType.value;
      const mode = modeSelect.value;

      if (mode !== 'traditional' && sType === 'both' && tHours > 0 && pHours > 0) {
        ePartField.classList.remove('hidden');
      } else {
        ePartField.classList.add('hidden');
      }

      if (mode !== 'traditional') {
        eHoursField.classList.remove('hidden');
        let maxEHours = 0;

        if (sType === 'theory' || (sType === 'both' && ePartSelect.value === 'theory')) {
          maxEHours = tHours;
        } else if (sType === 'practical' || (sType === 'both' && ePartSelect.value === 'practical')) {
          maxEHours = pHours;
        }

        eHoursSelect.innerHTML = '';
        for (let i = 1; i <= maxEHours; i++) {
          eHoursSelect.innerHTML += `<option value="${i}">${i} ${i==1?'ساعة':'ساعات'}</option>`;
        }
        eHoursSelect.value = maxEHours;
      } else {
        eHoursField.classList.add('hidden');
      }
    }


    addBtn.addEventListener('click', function() {
      if(!currentCourseData) {
        alert('الرجاء اختيار المقرر أولاً');
        return;
      }

      const selectedCourseName = courseSelect.value;
      const sType = scheduleType.value;
      const mode = modeSelect.value;
      const ePart = ePartSelect.value; 
      const eSelectedHours = parseInt(eHoursSelect.value) || 0;

      const originalTheory = parseFloat(currentCourseData['محاضرة']) || 0;
      const originalPractical = parseFloat(currentCourseData['عملي']) || 0;

      let displayTheory = 0;
      let displayPractical = 0;
      let displayElearning = 0;
      let calculatedHours = 0;
      let modeText = "";
      let expText = "";

      if (sType === 'both') {
        displayTheory = originalTheory;
        displayPractical = originalPractical;
      } else if (sType === 'theory') {
        displayTheory = originalTheory;
        displayPractical = 0;
      } else if (sType === 'practical') {
        displayTheory = 0;
        displayPractical = originalPractical;
      }

      if (mode !== 'traditional') {
        displayElearning = eSelectedHours;
        
        let targetPart = '';
        if (sType === 'theory') targetPart = 'theory';
        else if (sType === 'practical') targetPart = 'practical';
        else if (sType === 'both') targetPart = ePart;

        if (targetPart === 'theory') {
          displayTheory -= displayElearning;
          modeText = sType === 'both' ? (mode === 'distance' ? "مدمج عن بعد (نظري)" : "مدمج ذاتي (نظري)") : (mode === 'distance' ? "نظري عن بعد" : "نظري ذاتي");
        } else {
          displayPractical -= displayElearning;
          modeText = sType === 'both' ? (mode === 'distance' ? "مدمج عن بعد (عملي)" : "مدمج ذاتي (عملي)") : (mode === 'distance' ? "عملي عن بعد" : "عملي ذاتي");
        }

        // هنا تم التعديل لمعالجة الشق الإلكتروني للعملي
        let eHoursCalc = 0;
        let eReason = "";
        
        if (mode === 'distance') {
          if (targetPart === 'theory') {
            eHoursCalc = displayElearning; // يُضرب في 1
            eReason = `يُحسب عن بعد بالكامل كنظري (${displayElearning})`;
          } else {
            eHoursCalc = displayElearning * PRACTICAL_FACTOR; // يُضرب في معامل العملي
            eReason = `يُحسب عن بعد بمعامل العملي (${displayElearning} × ${PRACTICAL_FACTOR})`;
          }
        } else {
          // نمط ذاتي لا يُحسب
          eHoursCalc = 0;
          eReason = `لا يُحسب ساعات للنمط الذاتي (0)`;
        }
        
        calculatedHours = (displayTheory * 1) + (displayPractical * PRACTICAL_FACTOR) + eHoursCalc;
        expText = `النمط (${modeText}): حضور نظري (${displayTheory}) + حضور عملي (${displayPractical} × ${PRACTICAL_FACTOR}) | الإلكتروني: ${displayElearning} ساعة (${eReason}). الإجمالي = ${calculatedHours.toFixed(2)} ساعة.`;

      } else {
        modeText = sType === 'both' ? "تقليدي (كامل المقرر)" : (sType === 'theory' ? "تقليدي (نظري فقط)" : "تقليدي (عملي فقط)");
        calculatedHours = (displayTheory * 1) + (displayPractical * PRACTICAL_FACTOR);
        expText = `احتساب تقليدي: حضور نظري (${displayTheory}) + حضور عملي (${displayPractical} × ${PRACTICAL_FACTOR}). الإجمالي = ${calculatedHours.toFixed(2)} ساعة.`;
      }

      schedule.push({
        id: Date.now(),
        name: selectedCourseName,
        modeText: modeText,
        displayTheory: displayTheory,
        displayPractical: displayPractical,
        displayElearning: displayElearning,
        calculated: calculatedHours,
        expText: expText
      });

      renderTable();
    });

    function renderTable() {
      scheduleBody.innerHTML = '';
      if(schedule.length === 0) {
        scheduleBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--muted);">لم يتم إضافة مقررات بعد</td></tr>';
        resultBox.style.display = 'none';
        return;
      }

      let total = 0;
      explanationList.innerHTML = '';

      schedule.forEach(item => {
        total += item.calculated;
        
        scheduleBody.innerHTML += `
          <tr>
            <td><strong>${item.name}</strong></td>
            <td>${item.modeText}</td>
            <td>${item.displayTheory}</td>
            <td>${item.displayPractical}</td>
            <td style="color:var(--primary); font-weight:bold;">${item.displayElearning}</td>
            <td style="font-weight:900; color:var(--accent); background:#f4fbfa;">${item.calculated.toFixed(2)}</td>
            <td><button class="btn-delete" onclick="removeCourse(${item.id})">حذف</button></td>
          </tr>
        `;
        explanationList.innerHTML += `<li><strong>${item.name}</strong>: ${item.expText}</li>`;
      });

      totalHoursEl.innerText = total.toFixed(2);
      resultBox.style.display = 'block';
    }

    function removeCourse(id) {
      schedule = schedule.filter(item => item.id !== id);
      renderTable();
    }
  </script>
</body>
</html>
