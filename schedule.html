<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بناء الجدول التدريبي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-2: #159e9c;
      --primary-3: #dff6f3;
      --accent: #0b5f59;
      --text: #153133;
      --muted: #5f6f72;
      --border: #d7e7e7;
      --white: #ffffff;
      --shadow: 0 20px 60px rgba(10, 55, 59, 0.12);
      --radius-xl: 28px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top right, rgba(21, 158, 156, 0.15), transparent 25%),
                  linear-gradient(180deg, #f5fbfb 0%, #eef7f6 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 40px;
    }
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: var(--shadow);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 22px;
    }
    .section-head h2 { margin: 0 0 8px; font-size: 24px; }
    .section-head p { margin: 0; color: var(--muted); }
    
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 18px;
      align-items: end;
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 700; font-size: 15px; }
    select, input {
      width: 100%; border: 1px solid var(--border); background: #fff;
      min-height: 52px; border-radius: 16px; padding: 12px 16px;
      font-family: inherit; font-size: 15px; color: var(--text); outline: none; transition: 0.2s ease;
    }
    select:focus, input:focus { border-color: var(--primary-2); box-shadow: 0 0 0 4px rgba(21, 158, 156, 0.12); }
    select:disabled { background: #f0f4f4; cursor: not-allowed; color: var(--muted); }
    
    .btn-add {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white; border: none; min-height: 52px; border-radius: 16px;
      font-weight: 700; font-size: 16px; font-family: inherit; cursor: pointer; transition: 0.2s ease;
    }
    .btn-add:hover { opacity: 0.9; transform: translateY(-2px); }

    table {
      width: 100%; border-collapse: collapse; margin-top: 20px;
      background: #fff; border-radius: 16px; overflow: hidden;
    }
    th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--border); }
    th { background: var(--primary-3); color: var(--accent); font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    
    .btn-delete {
      background: #ffe3e3; color: #d62828; border: none; padding: 6px 12px;
      border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600;
    }
    
    .result-box {
      margin-top: 24px; padding: 20px;
      background: linear-gradient(180deg, #f4fbfa 0%, #ecf8f6 100%);
      border: 1px solid var(--primary-2); border-radius: 16px;
    }
    .result-box h3 { margin: 0 0 10px 0; color: var(--accent); }
    .result-box ul { margin: 0; padding-right: 20px; line-height: 1.8; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="section-head">
        <h2>بناء الجدول التدريبي للمدرب</h2>
        <p>قم بتصفية المقررات ثم اختر نمط التنفيذ للإضافة إلى الجدول.</p>
      </div>

      <div class="form-grid">
        <!-- الحقول الجديدة للتصفية -->
        <div class="field">
          <label for="unitSelect">الوحدة التدريبية</label>
          <select id="unitSelect">
            <option value="">جاري التحميل...</option>
          </select>
        </div>

        <div class="field">
          <label for="stageSelect">المرحلة التدريبية</label>
          <select id="stageSelect" disabled>
            <option value="">اختر الوحدة أولاً</option>
          </select>
        </div>

        <div class="field">
          <label for="majorSelect">التخصص</label>
          <select id="majorSelect" disabled>
            <option value="">اختر المرحلة أولاً</option>
          </select>
        </div>

        <div class="field">
          <label for="courseSelect">المقرر التدريبي</label>
          <select id="courseSelect" disabled>
            <option value="">اختر التخصص أولاً</option>
          </select>
        </div>
      </div>

      <div class="form-grid" style="border-top: 1px solid var(--border); padding-top: 18px; margin-top: 18px;">
        <div class="field">
          <label for="modeSelect">نوع الجدولة / النمط</label>
          <select id="modeSelect">
            <option value="traditional">تقليدي (حضوري بالكامل)</option>
            <option value="distance">مدمج - عن بعد</option>
            <option value="self">مدمج - ذاتي</option>
          </select>
        </div>

        <div class="field hidden" id="ePartField">
          <label for="ePartSelect">الشق المحوّل لإلكتروني</label>
          <select id="ePartSelect">
            <option value="theory">الشق النظري</option>
            <option value="practical">الشق العملي</option>
          </select>
        </div>

        <div class="field">
          <button class="btn-add" id="addBtn">إضافة للجدول +</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-head">
        <h2>الجدول التدريبي الحالي</h2>
      </div>
      
      <div style="overflow-x: auto;">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>المقرر</th>
              <th>النمط</th>
              <th>حضور (نظري)</th>
              <th>حضور (عملي)</th>
              <th>إلكتروني (مدمج)</th>
              <th>الاحتساب (الساعات)</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--muted);">لم يتم إضافة مقررات بعد</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="result-box" id="resultBox" style="display: none;">
        <h3>إجمالي النصاب التدريبي: <span id="totalHours" style="font-weight:900;">0</span> ساعة</h3>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
        <strong>شرح تفصيلي لآلية الحساب:</strong>
        <ul id="explanationList"></ul>
      </div>
    </div>
  </main>

  <script>
    const PRACTICAL_FACTOR = 0.66667;
    let allCourses = []; 
    let schedule = []; 

    // تعريف متغيرات الحقول
    const unitSelect = document.getElementById('unitSelect');
    const stageSelect = document.getElementById('stageSelect');
    const majorSelect = document.getElementById('majorSelect');
    const courseSelect = document.getElementById('courseSelect');
    
    const modeSelect = document.getElementById('modeSelect');
    const ePartField = document.getElementById('ePartField');
    const ePartSelect = document.getElementById('ePartSelect');
    const addBtn = document.getElementById('addBtn');
    
    const scheduleBody = document.getElementById('scheduleBody');
    const resultBox = document.getElementById('resultBox');
    const totalHoursEl = document.getElementById('totalHours');
    const explanationList = document.getElementById('explanationList');

    // إظهار/إخفاء حقل اختيار الشق الإلكتروني
    modeSelect.addEventListener('change', function() {
      if (this.value === 'traditional') {
        ePartField.classList.add('hidden');
      } else {
        ePartField.classList.remove('hidden');
      }
    });

    // قراءة ملف الإكسل (CSV)
    Papa.parse("courses.csv", {
      download: true,
      header: true,
      complete: function(results) {
        allCourses = results.data.filter(row => row['المقرر']); 
        populateUnits(); // استدعاء دالة تعبئة الوحدات أولاً
      },
      error: function() {
        unitSelect.innerHTML = '<option value="">حدث خطأ في تحميل ملف الخطط</option>';
      }
    });

    // 1. تعبئة الوحدات التدريبية
    function populateUnits() {
      // جلب الوحدات الفريدة وتجاهل الفارغ منها
      const units = [...new Set(allCourses.map(course => course['الوحدة التدريبية']))].filter(Boolean);
      unitSelect.innerHTML = '<option value="">-- اختر الوحدة التدريبية --</option>';
      units.forEach(unit => {
        unitSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
      });
    }

    // 2. عند تغيير الوحدة التدريبية -> تعبئة المراحل
    unitSelect.addEventListener('change', function() {
      const selectedUnit = this.value;
      
      // تصفير الحقول التي أسفلها
      stageSelect.innerHTML = '<option value="">اختر الوحدة أولاً</option>';
      stageSelect.disabled = true;
      majorSelect.innerHTML = '<option value="">اختر المرحلة أولاً</option>';
      majorSelect.disabled = true;
      courseSelect.innerHTML = '<option value="">اختر التخصص أولاً</option>';
      courseSelect.disabled = true;

      if (!selectedUnit) return;

      const filteredByUnit = allCourses.filter(c => c['الوحدة التدريبية'] === selectedUnit);
      const stages = [...new Set(filteredByUnit.map(c => c['المرحلة التدريبية']))].filter(Boolean);
      
      stageSelect.innerHTML = '<option value="">-- اختر المرحلة التدريبية --</option>';
      stages.forEach(stage => {
        stageSelect.innerHTML += `<option value="${stage}">${stage}</option>`;
      });
      stageSelect.disabled = false;
    });

    // 3. عند تغيير المرحلة التدريبية -> تعبئة التخصصات
    stageSelect.addEventListener('change', function() {
      const selectedUnit = unitSelect.value;
      const selectedStage = this.value;

      // تصفير الحقول التي أسفلها
      majorSelect.innerHTML = '<option value="">اختر المرحلة أولاً</option>';
      majorSelect.disabled = true;
      courseSelect.innerHTML = '<option value="">اختر التخصص أولاً</option>';
      courseSelect.disabled = true;

      if (!selectedStage) return;

      const filteredByStage = allCourses.filter(c => 
        c['الوحدة التدريبية'] === selectedUnit && 
        c['المرحلة التدريبية'] === selectedStage
      );
      
      const majors = [...new Set(filteredByStage.map(c => c['التخصص']))].filter(Boolean);
      
      majorSelect.innerHTML = '<option value="">-- اختر التخصص --</option>';
      majors.forEach(major => {
        majorSelect.innerHTML += `<option value="${major}">${major}</option>`;
      });
      majorSelect.disabled = false;
    });

    // 4. عند تغيير التخصص -> تعبئة المقررات
    majorSelect.addEventListener('change', function() {
      const selectedUnit = unitSelect.value;
      const selectedStage = stageSelect.value;
      const selectedMajor = this.value;

      // تصفير حقل المقررات
      courseSelect.innerHTML = '<option value="">اختر التخصص أولاً</option>';
      courseSelect.disabled = true;

      if (!selectedMajor) return;

      const filteredCourses = allCourses.filter(c => 
        c['الوحدة التدريبية'] === selectedUnit && 
        c['المرحلة التدريبية'] === selectedStage &&
        c['التخصص'] === selectedMajor
      );
      
      courseSelect.innerHTML = '<option value="">-- اختر المقرر --</option>';
      filteredCourses.forEach(course => {
        courseSelect.innerHTML += `<option value="${course['المقرر']}">${course['المقرر']}</option>`;
      });
      courseSelect.disabled = false;
    });


    // إضافة المقرر للجدول
    addBtn.addEventListener('click', function() {
      const selectedCourseName = courseSelect.value;
      const mode = modeSelect.value;
      const ePart = ePartSelect.value; 

      if(!selectedCourseName) {
        alert('الرجاء اختيار المقرر أولاً');
        return;
      }

      // البحث عن المقرر باستخدام الوحدة والمرحلة والتخصص واسم المقرر لضمان الدقة
      const courseData = allCourses.find(c => 
        c['الوحدة التدريبية'] === unitSelect.value &&
        c['المرحلة التدريبية'] === stageSelect.value &&
        c['التخصص'] === majorSelect.value &&
        c['المقرر'] === selectedCourseName
      );
      
      const originalTheory = parseFloat(courseData['محاضرة']) || 0;
      const originalPractical = parseFloat(courseData['عملي']) || 0;

      let displayTheory = originalTheory;
      let displayPractical = originalPractical;
      let displayElearning = 0;
      let calculatedHours = 0;
      let modeText = "تقليدي";
      let expText = "";

      if (mode === 'traditional') {
        calculatedHours = originalTheory + (originalPractical * PRACTICAL_FACTOR);
        expText = `احتساب تقليدي: النظري (${originalTheory}) + العملي (${originalPractical} × ${PRACTICAL_FACTOR}) = ${calculatedHours.toFixed(2)} ساعة.`;
      } 
      else {
        if (ePart === 'theory') {
          displayElearning = originalTheory; 
          displayTheory = 0; 
          modeText = mode === 'distance' ? "عن بعد (للنظري)" : "ذاتي (للنظري)";
        } else {
          displayElearning = originalPractical; 
          displayPractical = 0; 
          modeText = mode === 'distance' ? "عن بعد (للعملي)" : "ذاتي (للعملي)";
        }

        let physicalHours = displayTheory + (displayPractical * PRACTICAL_FACTOR);
        let eHoursCalc = mode === 'distance' ? displayElearning : 0; 
        calculatedHours = physicalHours + eHoursCalc;

        let eReason = mode === 'distance' ? `يحتسب كاملاً (${displayElearning})` : `لا يحتسب ساعات للتدريب الذاتي (0)`;
        expText = `نمط ${modeText}: تم تحويل الشق المختار لساعات إلكترونية (${displayElearning} ساعة) و${eReason}. الساعات الحضورية المتبقية: نظري (${displayTheory}) + عملي (${displayPractical} × ${PRACTICAL_FACTOR}). الإجمالي = ${calculatedHours.toFixed(2)} ساعة.`;
      }

      schedule.push({
        id: Date.now(),
        name: selectedCourseName,
        modeText: modeText,
        displayTheory: displayTheory,
        displayPractical: displayPractical,
        displayElearning: displayElearning,
        calculated: calculatedHours,
        expText: expText
      });

      renderTable();
    });

    // رسم الجدول
    function renderTable() {
      scheduleBody.innerHTML = '';
      if(schedule.length === 0) {
        scheduleBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--muted);">لم يتم إضافة مقررات بعد</td></tr>';
        resultBox.style.display = 'none';
        return;
      }

      let total = 0;
      explanationList.innerHTML = '';

      schedule.forEach(item => {
        total += item.calculated;
        
        scheduleBody.innerHTML += `
          <tr>
            <td><strong>${item.name}</strong></td>
            <td>${item.modeText}</td>
            <td>${item.displayTheory}</td>
            <td>${item.displayPractical}</td>
            <td style="color:var(--primary); font-weight:bold;">${item.displayElearning}</td>
            <td style="font-weight:900; color:var(--accent); background:#f4fbfa;">${item.calculated.toFixed(2)}</td>
            <td><button class="btn-delete" onclick="removeCourse(${item.id})">حذف</button></td>
          </tr>
        `;

        explanationList.innerHTML += `<li><strong>${item.name}</strong>: ${item.expText}</li>`;
      });

      totalHoursEl.innerText = total.toFixed(2);
      resultBox.style.display = 'block';
    }

    function removeCourse(id) {
      schedule = schedule.filter(item => item.id !== id);
      renderTable();
    }
  </script>
</body>
</html>
